name: release

on:
  push:
    branches:
      - "release/v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-hygiene:
    uses: ./.github/workflows/repository-hygiene.yml
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: python3 -m unittest discover -s tests -p test_release_notes.py -v
      - run: bash tests/run-portable-tests.sh
      - run: bash tests/run-lua-tests.sh
      - run: bash tests/run-abi-syntax-test.sh

  windows-release:
    needs: [portable-tests, repository-hygiene]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Validate release version
        shell: pwsh
        run: |
          & ./tests/ReleaseMetadataTests.ps1
          & ./tests/PackageReleaseTests.ps1
          if ($env:GITHUB_REF_TYPE -ne 'branch') { throw 'Release must run on its versioned branch' }
          $metadata = & ./tools/release-metadata.ps1 -ReleaseRef $env:GITHUB_REF_NAME
          "RELEASE_VERSION=$($metadata.version)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$($metadata.tag)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PRERELEASE=$($metadata.prerelease)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TARGET_SHA=$env:GITHUB_SHA" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Native lifecycle tests and build
        shell: pwsh
        run: ./tools/ci-windows-native.ps1
      - name: Verify DLL version resource
        shell: pwsh
        run: |
          ./tools/test-dll-version.ps1 -Dll build/dist/_ModCore_UE4SSLuaEventBridge/dlls/main.dll -ExpectedVersion $env:RELEASE_VERSION -ExpectedProductName 'UE4SSLuaEventBridge Bootstrap' -ExpectedOriginalFilename 'main.dll'
          ./tools/test-dll-version.ps1 -Dll "build/dist/_ModCore_UE4SSLuaEventBridge/dlls/versions/UE4SSLuaEventBridge-$env:RELEASE_VERSION.dll" -ExpectedVersion $env:RELEASE_VERSION -ExpectedOriginalFilename "UE4SSLuaEventBridge-$env:RELEASE_VERSION.dll"
      - name: Package and checksum
        shell: pwsh
        run: |
          $archive = "UE4SSLuaEventBridge-v$env:RELEASE_VERSION.zip"
          & ./tools/package-release.ps1 -Distribution build/dist/_ModCore_UE4SSLuaEventBridge -OutputDirectory . -SourceCommit $env:RELEASE_TARGET_SHA
          "RELEASE_ARCHIVE=$archive" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          python tools/release_notes.py --tag $env:RELEASE_TAG --output $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $refs = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG" "refs/tags/$env:RELEASE_TAG^{}")
          if ($LASTEXITCODE) { throw 'Cannot verify existing release tag' }
          & ./tools/test-release-tag.ps1 -RemoteRefs $refs -Tag $env:RELEASE_TAG -ExpectedCommit $env:RELEASE_TARGET_SHA
          $arguments = @(
              "release", "create", $env:RELEASE_TAG,
              $env:RELEASE_ARCHIVE,
              "$($env:RELEASE_ARCHIVE).sha256",
              "$($env:RELEASE_ARCHIVE).manifest.json",
              "--target", $env:RELEASE_TARGET_SHA,
              "--title", "UE4SSLuaEventBridge $env:RELEASE_TAG"
          )
          $arguments += @("--notes-file", $notes)
          if ($env:RELEASE_PRERELEASE -eq 'True') { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
