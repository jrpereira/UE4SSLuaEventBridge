name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: bash tests/run-portable-tests.sh
      - run: bash tests/run-lua-tests.sh
      - run: bash tests/run-abi-syntax-test.sh

  windows-release:
    needs: portable-tests
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
              throw "Release tag must use vMAJOR.MINOR.PATCH"
          }
          $version = $Matches[1]
          $cmake = Get-Content CMakeLists.txt -Raw
          $declaration = "project(UE4SSLuaEventBridge VERSION $version LANGUAGES CXX)"
          if (-not $cmake.Contains($declaration)) {
              throw "Tag $env:GITHUB_REF_NAME does not match the CMake project version"
          }
          "RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUE4SSLEB_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Package and checksum
        shell: pwsh
        run: |
          $archive = "UE4SSLuaEventBridge-v$env:RELEASE_VERSION.zip"
          Compress-Archive -Path build/dist/UE4SSLuaEventBridge -DestinationPath $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $archive" | Set-Content "$archive.sha256" -Encoding ascii
          "RELEASE_ARCHIVE=$archive" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = ".github/release-notes/$env:GITHUB_REF_NAME.md"
          $arguments = @(
              "release", "create", $env:GITHUB_REF_NAME,
              $env:RELEASE_ARCHIVE,
              "$($env:RELEASE_ARCHIVE).sha256",
              "--verify-tag",
              "--title", "UE4SSLuaEventBridge $env:GITHUB_REF_NAME"
          )
          if (Test-Path $notes) {
              $arguments += @("--notes-file", $notes)
          } else {
              $arguments += "--generate-notes"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
