name: release

on:
  push:
    branches:
      - "release/v*.*.*"
  # Same-repository release PRs support publishers whose ref APIs do not emit push.
  pull_request:
    branches:
      - "release/v*.*.*"
    types:
      - opened

jobs:
  portable-tests:
    if: github.event_name == 'push' || (github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: bash tests/run-portable-tests.sh
      - run: bash tests/run-lua-tests.sh
      - run: bash tests/run-abi-syntax-test.sh

  windows-release:
    if: github.event_name == 'push' || (github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: portable-tests
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $releaseRef = if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
              $env:GITHUB_BASE_REF
          } else {
              $env:GITHUB_REF_NAME
          }
          $releaseTarget = if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
              $env:RELEASE_PR_HEAD_SHA
          } else {
              $env:GITHUB_SHA
          }
          if ($releaseRef -notmatch '^release/v([0-9]+\.[0-9]+\.[0-9]+)$') {
              throw "Release branch must use release/vMAJOR.MINOR.PATCH"
          }
          $version = $Matches[1]
          $tag = "v$version"
          $cmake = Get-Content CMakeLists.txt -Raw
          $declaration = "project(UE4SSLuaEventBridge VERSION $version LANGUAGES CXX)"
          if (-not $cmake.Contains($declaration)) {
              throw "Branch $releaseRef does not match the CMake project version"
          }
          "RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TARGET_SHA=$releaseTarget" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUE4SSLEB_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Package and checksum
        shell: pwsh
        run: |
          $archive = "UE4SSLuaEventBridge-v$env:RELEASE_VERSION.zip"
          Compress-Archive -Path build/dist/UE4SSLuaEventBridge -DestinationPath $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $archive" | Set-Content "$archive.sha256" -Encoding ascii
          "RELEASE_ARCHIVE=$archive" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = ".github/release-notes/$env:RELEASE_TAG.md"
          $arguments = @(
              "release", "create", $env:RELEASE_TAG,
              $env:RELEASE_ARCHIVE,
              "$($env:RELEASE_ARCHIVE).sha256",
              "--target", $env:RELEASE_TARGET_SHA,
              "--title", "UE4SSLuaEventBridge $env:RELEASE_TAG"
          )
          if (Test-Path $notes) {
              $arguments += @("--notes-file", $notes)
          } else {
              $arguments += "--generate-notes"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
