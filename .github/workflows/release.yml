name: release

on:
  push:
    branches:
      - "release/v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-hygiene:
    uses: ./.github/workflows/repository-hygiene.yml
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: bash tests/run-portable-tests.sh
      - run: bash tests/run-lua-tests.sh
      - run: bash tests/run-abi-syntax-test.sh
      - run: lua5.4 benchmarks/runner/test-consumer.lua Fountain Bridge
      - run: lua5.4 benchmarks/runner/test-consumer.lua Fountain Baseline
      - run: lua5.4 benchmarks/runner/test-consumer.lua Fountain Baseline Incomplete
      - run: python3 benchmarks/runner/test-cycle-summary.py 600
      - run: python3 benchmarks/runner/test-cycle-summary.py 300
      - run: python3 benchmarks/runner/test-package.py
      - shell: pwsh
        run: ./benchmarks/runner/test-runner-status.ps1
      - shell: pwsh
        run: ./benchmarks/runner/test-batch-configuration.ps1

  windows-release:
    needs: [portable-tests, repository-hygiene]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Validate release version
        shell: pwsh
        run: |
          & ./tests/ReleaseMetadataTests.ps1
          & ./tests/PackageReleaseTests.ps1
          & ./benchmarks/runner/test-staging.ps1
          if ($env:GITHUB_REF_TYPE -ne 'branch') { throw 'Release must run on its versioned branch' }
          $metadata = & ./tools/release-metadata.ps1 -ReleaseRef $env:GITHUB_REF_NAME
          "RELEASE_VERSION=$($metadata.version)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$($metadata.tag)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PRERELEASE=$($metadata.prerelease)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TARGET_SHA=$env:GITHUB_SHA" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUE4SSLEB_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Package and checksum
        shell: pwsh
        run: |
          $archive = "UE4SSLuaEventBridge-v$env:RELEASE_VERSION.zip"
          & ./tools/package-release.ps1 -Distribution build/dist/UE4SSLuaEventBridge -OutputDirectory . -SourceCommit $env:RELEASE_TARGET_SHA
          "RELEASE_ARCHIVE=$archive" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = ".github/release-notes/$env:RELEASE_TAG.md"
          $refs = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG" "refs/tags/$env:RELEASE_TAG^{}")
          if ($LASTEXITCODE) { throw 'Cannot verify existing release tag' }
          & ./tools/test-release-tag.ps1 -RemoteRefs $refs -Tag $env:RELEASE_TAG -ExpectedCommit $env:RELEASE_TARGET_SHA
          $arguments = @(
              "release", "create", $env:RELEASE_TAG,
              $env:RELEASE_ARCHIVE,
              "$($env:RELEASE_ARCHIVE).sha256",
              "$($env:RELEASE_ARCHIVE).manifest.json",
              "--target", $env:RELEASE_TARGET_SHA,
              "--title", "UE4SSLuaEventBridge $env:RELEASE_TAG"
          )
          if (Test-Path $notes) {
              $arguments += @("--notes-file", $notes)
          } else {
              $arguments += "--generate-notes"
          }
          if ($env:RELEASE_PRERELEASE -eq 'True') { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
