name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: bash tests/run-portable-tests.sh
      - run: bash tests/run-lua-tests.sh
      - run: bash tests/run-abi-syntax-test.sh

  windows-dll:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUE4SSLEB_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/dist/UE4SSLuaEventBridge -DestinationPath UE4SSLuaEventBridge-v0.3.1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: UE4SSLuaEventBridge-v0.3.1
          path: UE4SSLuaEventBridge-v0.3.1.zip
