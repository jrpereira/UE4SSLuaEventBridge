name: build

on:
  push:
    branches:
      - "**"
      - "!release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    uses: ./.github/workflows/repository-hygiene.yml
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: python3 -m unittest discover -s tests -p test_release_notes.py -v
      - run: bash tests/run-portable-tests.sh
      - run: bash tests/run-lua-tests.sh
      - run: bash tests/run-abi-syntax-test.sh

  windows-dll:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Release tooling tests
        # Metadata tests need PowerShell only, not the compiler.
        run: |
          ./tests/ReleaseMetadataTests.ps1
          ./tests/PackageReleaseTests.ps1
      - name: Native lifecycle tests and build
        shell: pwsh
        run: ./tools/ci-windows-native.ps1
      - name: Verify DLL version resource
        shell: pwsh
        run: |
          $metadata = & ./tools/release-metadata.ps1
          ./tools/test-dll-version.ps1 -Dll build/dist/_ModCore_UE4SSLuaEventBridge/dlls/main.dll -ExpectedProductName 'UE4SSLuaEventBridge Bootstrap' -ExpectedOriginalFilename 'main.dll'
          ./tools/test-dll-version.ps1 -Dll "build/dist/_ModCore_UE4SSLuaEventBridge/dlls/versions/UE4SSLuaEventBridge-$($metadata.version).dll" -ExpectedOriginalFilename "UE4SSLuaEventBridge-$($metadata.version).dll"
      - name: Package
        id: metadata
        shell: pwsh
        run: |
          $metadata = & ./tools/release-metadata.ps1 -OutputFile $env:GITHUB_OUTPUT
          & ./tools/package-release.ps1 -Distribution build/dist/_ModCore_UE4SSLuaEventBridge -OutputDirectory . -SourceCommit $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: UE4SSLuaEventBridge-${{ steps.metadata.outputs.tag }}
          path: |
            ${{ steps.metadata.outputs.archive }}
            ${{ steps.metadata.outputs.archive }}.manifest.json
            ${{ steps.metadata.outputs.archive }}.sha256
