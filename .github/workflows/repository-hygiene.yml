name: Repository hygiene
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test guards
        # Every test module runs, so a new one cannot be skipped by omission.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check tree and introduced commits
        run: python tools/check_incoming_history.py
